  # ── Frontend: Type-check + Lint + Unit Tests ──────────────────────────────
  frontend-ci:
    name: Frontend — Type Check, Lint & Vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/collab-whiteboard-ui

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/collab-whiteboard-ui/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm run test:unit -- --reporter=verbose

