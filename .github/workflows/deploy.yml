name: Deploy to Azure

on:
  push:
    branches: [main]

permissions:
  id-token: write   # Required for OIDC (no long-lived credentials)
  contents: read

jobs:
  build-and-push:
    name: Build Docker Image & Push to ACR
    runs-on: ubuntu-latest

    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC — no stored secrets)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set image tag
        id: meta
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Login to Azure Container Registry
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push image (with GitHub Actions cache)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/collabwhiteboard:${{ github.sha }}
            ${{ secrets.ACR_LOGIN_SERVER }}/collabwhiteboard:latest
          build-args: |
            VITE_API_URL=/
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy container to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          images: '${{ secrets.ACR_LOGIN_SERVER }}/collabwhiteboard:${{ github.sha }}'

      - name: Wait for health check
        run: |
          echo "Waiting for app to become healthy..."
          for i in {1..20}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              https://${{ secrets.AZURE_WEBAPP_NAME }}.azurewebsites.net/health)
            if [ "$STATUS" = "200" ]; then
              echo "App is healthy (HTTP 200)"
              exit 0
            fi
            echo "Attempt $i: got HTTP $STATUS — retrying in 15s..."
            sleep 15
          done
          echo "Health check failed after 5 minutes"
          exit 1

      - name: Announce deployment
        run: |
          echo "🚀 Deployed ${{ github.sha }} to ${{ secrets.AZURE_WEBAPP_NAME }}.azurewebsites.net"
