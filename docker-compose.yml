version: '3.9'

services:
  # ── SQL Server (local dev) ─────────────────────────────────────────────────
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: YourStrong!Password1
    ports:
      - '1433:1433'
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ['CMD-SHELL', '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P YourStrong!Password1 -Q "SELECT 1" -C -N -l 5 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── ASP.NET Core API ──────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000
    ports:
      - '5000:8080'
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: >
        Server=db,1433;Database=CollabWhiteboard;User Id=sa;
        Password=YourStrong!Password1;TrustServerCertificate=true;
      ConnectionStrings__AzureSignalR: ''    # empty = self-hosted SignalR
      Jwt__Key: dev-secret-key-minimum-32-chars-long!!
      Jwt__Issuer: CollabWhiteboard
      Jwt__Audience: CollabWhiteboardUsers
      Cors__AllowedOrigins__0: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy

  # ── Vue 3 dev server (only needed for local hot-reload dev) ────────────────
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci --legacy-peer-deps && npm run dev -- --host 0.0.0.0"
    ports:
      - '5173:5173'
    volumes:
      - ./frontend/collab-whiteboard-ui:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:5000

volumes:
  sqldata:
